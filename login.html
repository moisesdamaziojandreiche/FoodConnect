<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login - FoodAdmin</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#e85d04">
</head>

<body class="login-page">

    <main class="login-card">

        <img
            class="marca"
            src="assets/img/logo.png"
            alt="FoodConnect"
            width="444"
            height="307"
        >

        <h1>FoodAdmin</h1>

        <p>
            Entre no painel da sua empresa.
        </p>

        <form id="loginForm">

            <label for="email">
                E-mail

                <input
                    id="email"
                    type="email"
                    required
                >
            </label>

            <label for="password">
                Senha

                <input
                    id="password"
                    type="password"
                    required
                >
            </label>

            <button type="submit">
                Entrar
            </button>

            <a href="cadastro.html" class="cad">Cadastre-se aqui!</a>

            <p
                id="loginError"
                class="error"
            ></p>

        </form>

    </main>

    <script
        type="module"
        src="js/auth/auth.js"
    ></script>

</body>
</html>
