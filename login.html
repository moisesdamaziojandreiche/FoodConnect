<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login - FoodAdmin</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >
</head>

<body class="login-page">

    <main class="login-card">

        <h1>FoodAdmin</h1>

        <p>
            Entre no painel da sua empresa.
        </p>

        <form id="loginForm">

            <label for="email">
                E-mail

                <input
                    id="email"
                    type="email"
                    required
                >
            </label>

            <label for="password">
                Senha

                <input
                    id="password"
                    type="password"
                    required
                >
            </label>

            <button type="submit">
                Entrar
            </button>

            <a href="cadastro.html" class="cad">Cadastre-se aqui!</a>

            <p
                id="loginError"
                class="error"
            ></p>

        </form>

    </main>

    <script
        type="module"
        src="js/auth/auth.js"
    ></script>

</body>
</html>
