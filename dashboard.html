<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard</title><link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#e85d04">
</head>
<body>
    <aside id="sidebar"></aside>
    <main class="content">
        <h1>Dashboard</h1>
        <p id="empresaNome" class="muted"></p>
        <section class="grid">
            <article class="card">
                <span>Pedidos de hoje</span>
                <strong id="todayOrders">0</strong>
            </article>
            <article class="card">
                <span>Pendentes</span>
                <strong id="pendingOrders">0</strong>
            </article>
            <article class="card">
                <span>Em preparação</span>
                <strong id="preparingOrders">0</strong>
            </article>
            <article class="card">
                <span>Concluídos</span>
                <strong id="completedOrders">0</strong>
            </article>
            <article class="card">
                <span>Faturamento de hoje</span>
                <strong id="revenue">R$ 0,00</strong>
            </article>
        </section>

        <section class="mensal">
            <header class="mensal-topo">
                <div>
                    <h2>Faturamento mensal</h2>
                    <p class="muted">Pedidos pagos e não cancelados.</p>
                </div>

                <label class="mensal-mes">
                    Mês
                    <input type="month" id="mesFaturamento">
                </label>
            </header>

            <div class="mensal-cards">
                <article class="mensal-card destaque">
                    <span>Faturamento do mês</span>
                    <strong id="mesTotal">R$ 0,00</strong>
                    <small id="mesVariacao"></small>
                </article>

                <article class="mensal-card">
                    <span>Pedidos pagos</span>
                    <strong id="mesPedidos">0</strong>
                </article>

                <article class="mensal-card">
                    <span>Ticket médio</span>
                    <strong id="mesTicket">R$ 0,00</strong>
                </article>

                <article class="mensal-card">
                    <span>Melhor dia</span>
                    <strong id="mesMelhorDia">—</strong>
                    <small id="mesMelhorDiaValor"></small>
                </article>
            </div>

            <article class="card mensal-grafico">
                <h3>Faturamento por dia</h3>
                <div id="mesGrafico" class="grafico-barras"></div>
                <p id="mesMensagem" class="muted"></p>
            </article>
        </section>
    </main>
    <script type="module" src="js/dashboard/dashboard.js">
    </script>
</body>
</html>
